name: Validate Schema & Build SQLite DB

on:
  push:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'src/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate YAML Schema & Compile horology.db
        run: python3 src/build_db.py

      - name: Commit updated horology.db on push to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add horology.db
          if git diff --staged --quiet; then
            echo "No changes to horology.db"
          else
            git commit -m "chore(db): auto-compile horology.db from YAML [skip ci]"
            git push
          fi
