name: Validate, Build SQLite & Publish Datasette Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate YAML Schema & Compile horology.db
        run: python3 src/build_db.py

      - name: Prepare _site directory for GitHub Pages
        run: |
          mkdir -p _site
          cp horology.db metadata.json _site/
          cat << 'HTML' > _site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Watch-Agent Horology Database</title>
            <style>
              body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1a1a1a; }
              iframe { border: none; width: 100%; height: 100%; }
            </style>
          </head>
          <body>
            <script>
              const baseUrl = window.location.origin + window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
              const dbUrl = encodeURIComponent(baseUrl + '/horology.db');
              const metaUrl = encodeURIComponent(baseUrl + '/metadata.json');
              const liteUrl = `https://lite.datasette.io/?url=${dbUrl}&metadata=${metaUrl}#/horology/v_watch_catalog`;
              document.write(`<iframe src="${liteUrl}" allow="clipboard-write"></iframe>`);
            </script>
          </body>
          </html>
          HTML
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
